baseURL = "https://aiappguide.co.uk/"
languageCode = "en-gb"
title = "AI App Guide"
theme = "PaperMod"

[pagination]
  pagerSize = 10

[params]
  env = "production"
  title = "AI App Guide"
  description = "Honest reviews and guides for the best AI tools and apps — helping UK users work smarter."
  keywords = ["AI tools", "AI apps", "AI reviews", "productivity", "UK"]
  author = "AI App Guide"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Custom CSS
  assets.customCSS = ["css/custom.css"]

  # Cover image settings
  cover.linkFullImages = true
  cover.responsiveImages = true

[params.homeInfoParams]
  Title = "Your Guide to the Best AI Tools"
  Content = "Honest reviews, comparisons and guides for AI apps — so you know what's worth using before you spend a penny."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/YOUR_USERNAME"

[params.analytics.google]
  SiteVerificationTag = ""

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[menu]
  [[menu.main]]
    identifier = "all-reviews"
    name = "All Reviews"
    url = "/categories/reviews/"
    weight = 10

  [[menu.main]]
    identifier = "reviews"
    name = "Reviews"
    url = "/categories/reviews/"
    weight = 20

  [[menu.main]]
    identifier = "best-picks"
    name = "Best Picks"
    url = "/categories/best-picks/"
    weight = 30

  [[menu.main]]
    identifier = "tools"
    name = "Tools"
    url = "/tools/llm-api-pricing-calculator/"
    weight = 35

  [[menu.main]]
    identifier = "guides"
    name = "Guides"
    url = "/categories/guides/"
    weight = 40

  [[menu.main]]
    identifier = "comparisons"
    name = "Comparisons"
    url = "/categories/comparisons/"
    weight = 50

[markup.highlight]
  noClasses = false